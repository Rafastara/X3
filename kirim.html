<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Pesan Anonymous</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- GLOBAL RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* --- HEADING --- */
        h1 {
            text-align: center;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #000000;
            letter-spacing: -1px;
        }

        /* --- INPUT BOX --- */
        .input-box {
            background: #ffffff;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            margin-bottom: 20px;
        }

        /* --- LABELS --- */
        .input-box label {
            display: block;
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 10px;
            margin-top: 25px;
        }

        /* --- INPUTS & TEXTAREA --- */
        input[type="text"], textarea {
            width: 100%;
            background: #ffffff;
            border: 2px solid #d1d5db;
            border-radius: 16px;
            color: #1a1a1a;
            padding: 16px 20px;
            font-size: 18px;
            margin-bottom: 0;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #9ca3af;
            font-size: 18px;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #86efac;
            box-shadow: 0 0 0 3px rgba(134, 239, 172, 0.2);
        }

        textarea {
            resize: none;
            min-height: 140px;
            font-size: 18px;
            line-height: 1.5;
        }

        /* --- FILE UPLOAD --- */
        .file-upload-wrapper {
            position: relative;
            margin-bottom: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .file-label {
            display: block;
            background: #d1d5db;
            color: #374151;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            border: 2px solid #9ca3af;
            transition: all 0.2s;
        }

        .file-label:hover {
            background: #c4c8ce;
            border-color: #6b7280;
        }

        #imagePreviewContainer {
            margin-top: 12px;
            display: none;
            position: relative;
            background: #f3f4f6;
            border-radius: 16px;
            padding: 10px;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .remove-img-btn {
            display: block;
            text-align: center;
            color: #ef4444;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 600;
        }

        /* --- BUTTON --- */
        button {
            width: 100%;
            padding: 18px;
            background-color: #bbf7d0;
            color: #166534;
            border: 2px solid #86efac;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 22px;
            margin-top: 30px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #86efac;
            border-color: #4ade80;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #e5e7eb;
            border-color: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
        }

        /* --- NAV LINK --- */
        .nav-link {
            text-align: center;
            margin-top: 30px;
            color: #22c55e;
            text-decoration: underline;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            display: block;
        }

        .nav-link:hover {
            color: #16a34a;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }

            input[type="text"], textarea, .file-label, button {
                font-size: 16px;
            }

            .input-box label {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kirim Pesan</h1>

        <div class="input-box">
            <label for="senderInput">Dari</label>
            <input type="text" id="senderInput" placeholder="Nama pengirim / anonim">

            <label for="recipientInput">Untuk</label>
            <input type="text" id="recipientInput" placeholder="Nama penerima">

            <label for="messageInput">Message</label>
            <textarea id="messageInput" placeholder="Pesan"></textarea>

            <label>Gambar</label>
            <div class="file-upload-wrapper">
                <label for="imageInput" class="file-label">Klik disini untuk menambah gambar</label>
                <input type="file" id="imageInput" accept="image/*" hidden onchange="handleImageSelect()">

                <div id="imagePreviewContainer">
                    <img id="previewImage" class="preview-image" src="#" alt="Preview">
                    <span class="remove-img-btn" onclick="removeImage()">Hapus Gambar</span>
                </div>
            </div>

            <button id="sendBtn" onclick="sendMessage()">Kirim</button>
        </div>

        <a href="baca.html" class="nav-link">Lihat Pesan</a>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE (GANTI DENGAN DATA KAMU) ---
        const supabaseUrl = 'https://vsnuptrzqzrxrltbxbrz.supabase.co'; 
        const supabaseKey = 'sb_publishable_41Em7Uj8lkqJIq3rgQ2FNA_v4vT15Xg'; 

        const client = supabase.createClient(supabaseUrl, supabaseKey);
        let selectedFile = null;

        function handleImageSelect() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Ukuran gambar terlalu besar! Maks 2MB.");
                    fileInput.value = "";
                    return;
                }
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedFile = null;
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        async function sendMessage() {
            const senderInput = document.getElementById('senderInput');
            const recipientInput = document.getElementById('recipientInput');
            const messageInput = document.getElementById('messageInput');

            const sender = senderInput.value.trim();
            const recipient = recipientInput.value.trim();
            const content = messageInput.value.trim();

            if (!content && !selectedFile) {
                alert("Tulis pesan atau pilih gambar dulu!");
                return;
            }
            if (!recipient) {
                alert("Siapa nih yang kamu tuju? Isi nama penerima.");
                return;
            }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            let imageUrl = null;

            try {
                // 1. Upload Gambar
                if (selectedFile) {
                    const fileName = `${Date.now()}-${selectedFile.name}`;
                    const { data, error } = await client.storage.from('message-images').upload(fileName, selectedFile);
                    if (error) throw error;

                    const { data: urlData } = client.storage.from('message-images').getPublicUrl(fileName);
                    imageUrl = urlData.publicUrl;
                }

                // 2. Simpan ke Database
                const payload = { 
                    content: content, 
                    sender: sender, 
                    recipient: recipient,
                    image_url: imageUrl 
                };

                const { error: dbError } = await client.from('messages').insert([payload]);
                if (dbError) throw dbError;

                alert("Pesan berhasil dikirim!");
                messageInput.value = '';
                removeImage();
            } catch (error) {
                console.error(error);
                alert("Gagal mengirim: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim";
            }
        }
    </script>
</body>
  </html>
